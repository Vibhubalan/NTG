name: Hourly leaderboard refresh

on:
  # Production uses daily-leaderboard-refresh.yml at 2:30 AM IST.
  # Keep this workflow for manual/staging use only — do not schedule it.
  workflow_dispatch:

concurrency:
  group: hourly-leaderboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Skip during IST quiet window (4–6 AM)
        id: gate
        run: |
          set -euo pipefail
          HOUR_IST="$(TZ=Asia/Kolkata date +%H)"
          echo "IST hour=${HOUR_IST}"
          if [ "$HOUR_IST" = "04" ] || [ "$HOUR_IST" = "05" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Quiet window — skipping hourly refresh."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run full leaderboard sync (hourly)
        if: steps.gate.outputs.skip != 'true'
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${SITE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing SITE_URL or CRON_SECRET repository secrets."
            exit 1
          fi

          SITE_URL="$(printf '%s' "$SITE_URL" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
          CRON_SECRET="$(printf '%s' "$CRON_SECRET" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"

          if ! printf '%s' "$SITE_URL" | grep -qE '^https?://[^[:space:]]+$'; then
            echo "SITE_URL secret is malformed."
            echo "Set it to: https://www.ntgesports.com"
            exit 1
          fi

          BASE="${SITE_URL%/}/api/cron/leaderboard-hourly"
          AUTH_HEADER="$(printf 'Authorization: Bearer %s' "$CRON_SECRET")"
          echo "Calling ${BASE}"
          ATTEMPTS=0
          MAX_ATTEMPTS=100
          MODE="start"
          COMPLETE="false"

          while [ "$ATTEMPTS" -lt "$MAX_ATTEMPTS" ]; do
            echo "--- Attempt $((ATTEMPTS + 1)): mode=${MODE} ---"
            HTTP_CODE=$(curl -sS -G -o /tmp/sync-response.json -w '%{http_code}' \
              --max-time 65 \
              --url "$BASE" \
              --data-urlencode "mode=${MODE}" \
              -H "$AUTH_HEADER")

            cat /tmp/sync-response.json
            echo ""

            if [ "$HTTP_CODE" -ge 400 ]; then
              if [ "$HTTP_CODE" -eq 503 ]; then
                ERR=$(jq -r '.error // empty' /tmp/sync-response.json)
                if printf '%s' "$ERR" | grep -qi 'not enabled'; then
                  echo "Hourly refresh is not enabled on this deployment (set LEADERBOARD_HOURLY_REFRESH_ENABLED=true)."
                  exit 1
                fi
              fi
              if [ "$HTTP_CODE" -eq 504 ] || [ "$HTTP_CODE" -eq 502 ] || [ "$HTTP_CODE" -eq 503 ]; then
                echo "HTTP ${HTTP_CODE} — retrying with mode=continue."
                MODE="continue"
                ATTEMPTS=$((ATTEMPTS + 1))
                sleep 10
                continue
              fi
              echo "HTTP ${HTTP_CODE} from sync endpoint"
              exit 1
            fi

            STATUS=$(jq -r '.status // "error"' /tmp/sync-response.json)
            COMPLETE=$(jq -r '.complete // false' /tmp/sync-response.json)
            REASON=$(jq -r '.reason // ""' /tmp/sync-response.json)

            if [ "$STATUS" = "error" ]; then
              echo "Sync returned error status"
              exit 1
            fi

            if [ "$COMPLETE" = "true" ] || [ "$STATUS" = "complete" ]; then
              echo "Hourly leaderboard refresh complete."
              exit 0
            fi

            if [ "$STATUS" = "skipped" ]; then
              case "$REASON" in
                quiet_window_ist|already_running|daily_running)
                  echo "Skipped (${REASON}) — exiting successfully."
                  exit 0
                  ;;
                no_active_run)
                  if [ "$MODE" = "continue" ]; then
                    echo "No active run — starting fresh."
                    MODE="start"
                    ATTEMPTS=$((ATTEMPTS + 1))
                    sleep 5
                    continue
                  fi
                  ;;
                lock_missing)
                  MODE="continue"
                  ATTEMPTS=$((ATTEMPTS + 1))
                  sleep 5
                  continue
                  ;;
              esac
            fi

            MODE="continue"
            ATTEMPTS=$((ATTEMPTS + 1))
            sleep 10
          done

          echo "Exceeded max continue attempts (${MAX_ATTEMPTS})."
          exit 1
